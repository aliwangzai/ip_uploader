name: Upload iOS IPA to App Store

on:
  workflow_dispatch:
    inputs:
      ipa_path:
        description: 'Path to IPA (relative to repo root, e.g. build/MyApp.ipa)'
        required: true
        default: 'build/MyApp.ipa'
      app_identifier:
        description: 'Bundle ID (e.g. com.example.app)'
        required: true

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Verify IPA exists
        run: |
          if [ ! -f "${{ inputs.ipa_path }}" ]; then
            echo "::error::IPA not found at ${{ inputs.ipa_path }}"
            exit 1
          fi

      - name: Create App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_PRIVATE_KEY }}
        run: |
          mkdir -p fastlane
          python3 - <<'PY'
          import json, os
          key = os.environ['KEY_P8'].replace('\n', '\\n')
          data = {
              "key_id": os.environ['KEY_ID'],
              "issuer_id": os.environ['ISSUER_ID'],
              "key": key,
              "in_house": False,
          }
          with open('fastlane/api_key.json', 'w') as f:
              json.dump(data, f, indent=2)
          PY

      - name: Upload IPA to App Store
        env:
          IPA_PATH: ${{ inputs.ipa_path }}
          APP_IDENTIFIER: ${{ inputs.app_identifier }}
        run: |
          fastlane deliver \
            --api_key_path fastlane/api_key.json \
            --ipa "$IPA_PATH" \
            --app_identifier "$APP_IDENTIFIER" \
            --skip_screenshots \
            --skip_metadata \
            --precheck_include_in_app_purchases false \
            --force
